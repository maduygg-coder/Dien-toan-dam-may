
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sửa lịch học</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #171b24;
    color: white;
    max-width: 650px;
    margin: 40px auto;
    padding: 20px;
}
.card {
    background: #242b39;
    padding: 25px;
    border-radius: 12px;
}
label {
    display: block;
    margin: 15px 0 7px;
}
input, select {
    width: 100%;
    box-sizing: border-box;
    padding: 12px;
    border-radius: 8px;
    background: #151c29;
    color: white;
    border: 1px solid #667085;
}
button {
    margin-top: 20px;
    background: #2868e8;
    color: white;
    border: 0;
    padding: 12px 18px;
    border-radius: 8px;
    cursor: pointer;
}
.alert {
    background: #4c2530;
    color: #ffd9de;
    border: 1px solid #ed6476;
    padding: 15px;
    border-radius: 8px;
}
a { color: #9fc0ff; margin-left: 15px; }
</style>
</head>
<body>
<h1>Sửa lịch học</h1>
<div class="card">

{% if error %}
<div class="alert" role="alert">
<strong>⚠ Không thể lưu thay đổi!</strong>
<p>{{ error }}</p>
</div>
{% endif %}

<form method="post"
      action="{{ url_for('edit_schedule', schedule_id=schedule.id) }}">

<label>Tên môn học</label>
<input name="subject" value="{{ schedule.subject }}" required>

<label>Thứ học</label>
<select name="day" required>
{% for d in ['Thứ 2','Thứ 3','Thứ 4','Thứ 5',
             'Thứ 6','Thứ 7','Chủ nhật'] %}
<option value="{{ d }}"
{% if schedule.day == d %}selected{% endif %}>
{{ d }}
</option>
{% endfor %}
</select>

<label>Giờ bắt đầu</label>
<input type="time" name="start_time" step="900"
       value="{{ schedule.start_time }}" required>

<label>Giờ kết thúc</label>
<input type="time" name="end_time" step="900"
       value="{{ schedule.end_time }}" required>

<label>Phòng học</label>
<input name="room" value="{{ schedule.room }}" required>

<button type="submit">Lưu thay đổi</button>
<a href="{{ url_for('home') }}">Quay lại</a>

</form>
</div>
</body>
</html>
